<div class="product-container">
  <!-- Header -->
  <div class="page-header">
    <div>
      <h1>Products</h1>
      <p class="subtitle">Manage your product inventory</p>
    </div>
    <button class="btn-primary" (click)="openAddProduct()">+ Add Product</button>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading-state">Loading...</div>

  <!-- Error -->
  <div *ngIf="error" class="error-state">{{ error }}</div>

  <!-- Product Cards (FAST) -->
  <div *ngIf="!loading && products.length > 0" class="product-grid">
    <div *ngFor="let product of products; trackBy: trackById" class="product-item">
      <div class="product-icon">📦</div>
      <div class="product-info">
        <div class="product-name">{{ product.name || 'Unnamed' }}</div>
        <div class="product-sku">SKU: {{ product.sku || '—' }}</div>
      </div>
      <div class="product-price">PKR {{ product.selling_price || 0 | number }}</div>
      <div class="product-stock">
        <span class="stock-badge" [class.low-stock]="product.quantity <= 5">
          {{ product.quantity || 0 }}
        </span>
      </div>
      <div class="product-actions">
        <button class="btn-icon btn-edit" (click)="editProduct(product.id)">✏️</button>
        <button class="btn-icon btn-delete" (click)="deleteProduct(product.id)">🗑️</button>
      </div>
    </div>
  </div>

  <!-- Empty -->
  <div *ngIf="!loading && products.length === 0" class="empty-state">
    <span>📭</span>
    <h3>No products yet</h3>
    <button class="btn-primary" (click)="openAddProduct()">Add Product</button>
  </div>
</div>
